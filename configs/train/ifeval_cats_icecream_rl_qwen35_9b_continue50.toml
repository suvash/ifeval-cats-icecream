name = "ifeval-cats-icecream-rl-qwen35-9b-continue50"
model = "Qwen/Qwen3.5-9B"
checkpoint_id = "q6eksfhxgjywrify79x762ku"
loss = "rl"
max_steps = 125

# Training
batch_size = 128
rollouts_per_example = 8
learning_rate = 3e-5

[sampling]
max_tokens = 2048
temperature = 0.7
enable_thinking = false

[[env]]
id = "suvash/ifeval-cats-icecream"
args = { log_group_monitors = false }

# Online evaluation during training.
[eval]
interval = 25
num_examples = -1
rollouts_per_example = 2
skip_first_step = false

[[eval.env]]
id = "suvash/ifeval-cats-icecream"
args = { log_group_monitors = false }
num_examples = -1
rollouts_per_example = 2

[checkpoints]
interval = 25
keep_cloud = 4

[adapters]
interval = 0
keep_last = 1

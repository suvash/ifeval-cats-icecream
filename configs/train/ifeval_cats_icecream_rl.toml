name = "ifeval-cats-icecream-rl"
model = "Qwen/Qwen3.5-0.8B"
loss = "rl"
max_steps = 100

# Training
batch_size = 128
rollouts_per_example = 8
learning_rate = 3e-5

[sampling]
max_tokens = 2048
temperature = 0.7

[[env]]
id = "suvash/ifeval-cats-icecream"

# Online evaluation during training.
[eval]
interval = 25
num_examples = -1
rollouts_per_example = 2
skip_first_step = false

[[eval.env]]
id = "suvash/ifeval-cats-icecream"
num_examples = -1
rollouts_per_example = 2

[checkpoints]
interval = 25
keep_cloud = 4
